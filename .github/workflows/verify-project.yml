name: Verify travel planner

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  typescript-build:
    name: TypeScript build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Smoke-test API draft and approval flow (fallback mode)
        run: |
          npm run dev > /tmp/tripmate-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/health > /tmp/tripmate-health.json; then
              break
            fi
            sleep 2
          done

          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';

          const health = await fetch('http://127.0.0.1:3000/health');
          assert.equal(health.status, 200, 'health endpoint should return HTTP 200');
          const healthData = await health.json();
          assert.equal(healthData.status, 'ok');

          const draftResponse = await fetch('http://127.0.0.1:3000/api/travel', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({
              message: 'Plan a 5-day trip to Tokyo from Delhi for two people with a moderate budget.'
            })
          });
          assert.equal(draftResponse.status, 200, 'draft endpoint should return HTTP 200');
          const draft = await draftResponse.json();
          assert.equal(draft.success, true);
          assert.equal(draft.requires_approval, true);
          assert.ok(draft.thread_id, 'draft should include a thread_id');
          assert.ok(draft.selected_agents.includes('flight_agent'));
          assert.ok(draft.selected_agents.includes('hotel_agent'));

          const approvalResponse = await fetch('http://127.0.0.1:3000/api/travel/approve', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({
              thread_id: draft.thread_id,
              approved: true,
              feedback: ''
            })
          });
          assert.equal(approvalResponse.status, 200, 'approval endpoint should return HTTP 200');
          const finalPlan = await approvalResponse.json();
          assert.equal(finalPlan.success, true);
          assert.equal(finalPlan.requires_approval, false);
          assert.ok(finalPlan.answer, 'final response should not be empty');

          console.log('PASS: health, travel draft, specialist selection, and approval/finalization flow.');
          NODE

  python-static-checks:
    name: Python syntax and integration checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python files
        run: python -m compileall -q tools mcp_client.py custom_weather_mcp_server.py mcp_client_test.py test.py
      - name: Check recovered backend wiring
        run: |
          python - <<'PY'
          import ast
          import pathlib
          import sys

          root = pathlib.Path.cwd()
          backend = ast.parse((root / "tools/backend.py").read_text())
          client = ast.parse((root / "mcp_client.py").read_text())
          app = ast.parse((root / "tools/app.py").read_text())

          defined = {
              node.name for node in client.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef))
          }
          imported = set()
          for node in backend.body:
              if isinstance(node, ast.ImportFrom) and node.module == "mcp_client":
                  imported.update(alias.name for alias in node.names)

          missing = sorted(imported - defined)
          app_imports_backend_as_top_level = any(
              isinstance(node, ast.ImportFrom) and node.module == "backend"
              for node in app.body
          )
          missing_static = not (root / "tools/static").exists()
          missing_templates = not (root / "tools/templates").exists()

          print("Undefined backend MCP imports:", missing)
          print("FastAPI uses top-level 'backend' import:", app_imports_backend_as_top_level)
          print("tools/static absent:", missing_static)
          print("tools/templates absent:", missing_templates)

          failures = []
          if missing:
              failures.append("mcp_client.py is missing: " + ", ".join(missing))
          if app_imports_backend_as_top_level:
              failures.append("tools/app.py should import from its backend package")
          if missing_static or missing_templates:
              failures.append("FastAPI resolves static/templates to a directory that does not exist")

          if failures:
              print("\n::warning::Python integration issues remain:")
              for failure in failures:
                  print("::warning::" + failure)
              print("Python syntax passed; integration diagnostics are advisory until the recovered Python wiring is fixed.")
          PY
